<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmaps | Página no encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --azul: #075F99; --cian: #0891B2; --texto: #0F1B2D; --suave: #5B6B7F; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--texto);
      background: radial-gradient(900px 500px at 15% 10%, rgba(10,123,196,.12), transparent 60%),
                  radial-gradient(700px 450px at 90% 90%, rgba(8,145,178,.12), transparent 60%), #F5F8FC;
      overflow: hidden;
    }
    .card {
      position: relative; max-width: 460px; width: 100%; text-align: center; padding: 44px 32px 36px;
      background: rgba(255,255,255,.85); backdrop-filter: blur(12px); border: 1px solid #E2E8F0; border-radius: 22px;
      box-shadow: 0 1px 2px rgba(15,27,45,.05), 0 20px 50px -12px rgba(15,27,45,.18);
      animation: entrar .6s cubic-bezier(.2,.8,.2,1) backwards;
    }
    .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; color: var(--texto); text-decoration: none; margin-bottom: 26px; }
    .logo span { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--azul), var(--cian)); box-shadow: 0 6px 16px -4px rgba(7,95,153,.5); }
    .codigo { font-size: 84px; line-height: 1; font-weight: 800; letter-spacing: -3px; margin: 0; background: linear-gradient(135deg, var(--azul), var(--cian)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: flotar 5s ease-in-out infinite; }
    h1 { font-size: 22px; margin: 12px 0 8px; }
    p { color: var(--suave); line-height: 1.55; margin: 0 0 26px; font-size: 15px; }
    .acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; text-decoration: none; transition: transform .2s, box-shadow .2s; }
    .btn--primario { color: #fff; background: linear-gradient(135deg, var(--azul), var(--cian)); box-shadow: 0 8px 20px -6px rgba(7,95,153,.55); }
    .btn--secundario { color: var(--azul); background: #EEF5FB; }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid rgba(8,145,178,.4); outline-offset: 2px; }
    @keyframes entrar { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    @keyframes flotar { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .card, .codigo { animation: none; } .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <a class="logo" href="/"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Farmaps</a>
    <p class="codigo">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o fue movida. Revisa el enlace o vuelve a buscar tu medicamento.</p>
    <div class="acciones">
      <a class="btn btn--primario" href="/">Buscar medicamentos</a>
      <a class="btn btn--secundario" href="javascript:history.back()">Volver</a>
    </div>
  </main>
</body>
</html>
